<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/src/assets/logo-kromis-transparente.png"
    />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Kromis</title>
  </head>
  <body>
    <!-- BLOQUEIO INSTANTÂNEO PARA O INSTAGRAM DO IOS -->
    <script>
      (function () {
        var userAgent = navigator.userAgent || navigator.vendor || window.opera;
        var isIOS = /iPad|iPhone|iPod/.test(userAgent) && !window.MSStream;
        var isInAppInstagram = isIOS && /Instagram/.test(userAgent);

        if (isInAppInstagram) {
          var currentFullUrl = window.location.href;

          document.write(`
            <style>
              #kromis-instagram-warning-overlay {
                position: fixed !important;
                top: 0 !important;
                left: 0 !important;
                width: 100vw !important;
                height: 100vh !important;
                background-color: #18181b !important;
                z-index: 2147483647 !important;
                display: flex !important;
                align-items: center !important;
                justify-content: center !important;
                padding: 24px !important;
                box-sizing: border-box !important;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
                margin: 0 !important;
              }
              #kromis-instagram-warning-box {
                background: #27272a !important;
                color: #fff !important;
                width: 100% !important;
                max-width: 360px !important;
                border-radius: 16px !important;
                padding: 24px !important;
                text-align: center !important;
                box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8) !important;
                border: 1px solid rgba(255, 255, 255, 0.1) !important;
              }
              #kromis-instagram-warning-icon-box {
                width: 48px !important;
                height: 48px !important;
                background: rgba(236, 72, 153, 0.15) !important;
                border-radius: 12px !important;
                display: flex !important;
                align-items: center !important;
                justify-content: center !important;
                margin: 0 auto 16px auto !important;
              }
              #kromis-instagram-warning-overlay h3 {
                font-size: 18px !important;
                font-weight: 700 !important;
                margin: 0 0 8px 0 !important;
                color: #fff !important;
              }
              #kromis-instagram-warning-overlay p {
                font-size: 14px !important;
                color: #a1a1aa !important;
                line-height: 1.5 !important;
                margin: 0 0 20px 0 !important;
              }
              .kromis-btn {
                display: block !important;
                width: 100% !important;
                font-weight: 600 !important;
                font-size: 14px !important;
                padding: 12px 16px !important;
                border-radius: 8px !important;
                text-decoration: none !important;
                margin-bottom: 10px !important;
                box-sizing: border-box !important;
                text-align: center !important;
                cursor: pointer !important;
                border: none !important;
              }
              #kromis-open-btn {
                background: #2563eb !important;
                color: #fff !important;
              }
              #kromis-copy-btn {
                background: transparent !important;
                color: #d4d4d8 !important;
                border: 1px solid rgba(255, 255, 255, 0.2) !important;
              }
              #kromis-tip {
                margin-top: 16px !important;
                font-size: 12px !important;
                color: #71717a !important;
              }
            </style>
            <div id="kromis-instagram-warning-overlay">
              <div id="kromis-instagram-warning-box">
                <div id="kromis-instagram-warning-icon-box">
                  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ec4899" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
                </div>
                <h3>Abra no Safari</h3>
                <p>O navegador do Instagram bloqueia os agendamentos. Toque no botão abaixo para abrir no Safari ou copie o link.</p>
                <button class="kromis-btn" id="kromis-open-btn">
                  Abrir no Safari
                </button>
                <button id="kromis-copy-btn" class="kromis-btn">
                  Copiar Link da Página
                </button>
                <div id="kromis-tip">
                  Dica: Toque nos <strong>três pontinhos (...)</strong> acima e escolha "Abrir no Navegador".
                </div>
              </div>
            </div>
          `);

          window.addEventListener("DOMContentLoaded", function () {
            var openBtn = document.getElementById("kromis-open-btn");
            var copyBtn = document.getElementById("kromis-copy-btn");

            if (openBtn) {
              openBtn.addEventListener("click", function () {
                // Tenta forçar o esquema de URL do Safari no iOS
                var cleanUrl = currentFullUrl.replace(/^https?:\/\//, "");
                window.location.href = "x-safari-https://" + cleanUrl;

                // Plano B caso o esquema customizado não dispare de imediato
                setTimeout(function () {
                  window.open(currentFullUrl, "_system");
                }, 500);
              });
            }

            if (copyBtn) {
              copyBtn.addEventListener("click", function () {
                navigator.clipboard.writeText(currentFullUrl).then(function () {
                  copyBtn.textContent = "Link copiado! ✅";
                  copyBtn.style.color = "#4ade80";
                  setTimeout(function () {
                    copyBtn.textContent = "Copiar Link da Página";
                    copyBtn.style.color = "#d4d4d8";
                  }, 3000);
                });
              });
            }
          });
        }
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <script src="https://sdk.mercadopago.com/js/v2"></script>

    <script
      src="https://www.mercadopago.com/v2/security.js"
      output="deviceId"
    ></script>
  </body>
</html>
